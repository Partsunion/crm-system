server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # React/Vite SPA fallback. The policy deliberately allows inline styles
    # because React chart/layout primitives set style attributes, but scripts
    # remain restricted to fingerprinted same-origin bundles.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.partsunion.de https://webexapis.com https://*.webexapis.com https://*.webex.com https://*.wbx2.com https://*.ciscospark.com https://*.webexcontent.com wss://*.webex.com wss://*.wbx2.com wss://*.ciscospark.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; manifest-src 'self'; media-src 'self' blob: https://*.webex.com https://*.webexcontent.com https://*.wbx2.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.partsunion.de https://webexapis.com https://*.webexapis.com https://*.webex.com https://*.wbx2.com https://*.ciscospark.com https://*.webexcontent.com wss://*.webex.com wss://*.wbx2.com wss://*.ciscospark.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; manifest-src 'self'; media-src 'self' blob: https://*.webex.com https://*.webexcontent.com https://*.wbx2.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }

    # ─── Bilder duerfen woanders eingebettet werden ────────────────────────
    #
    # Unsere ausgehenden Mails (Lead-Benachrichtigung, Terminbestaetigung)
    # binden das Logo von hier ein:
    #     https://crm.partsunion.de/partsunion-logo-wordmark.png
    #
    # Mit Cross-Origin-Resource-Policy "same-origin" liefert der Server das
    # Bild zwar mit 200 aus, aber der BROWSER verwirft die Antwort, sobald die
    # einbettende Seite eine andere Herkunft hat. In der Mail-Leseansicht des
    # Admin-Dashboards stand deshalb ein kaputtes Bild statt des Logos. Mit
    # curl faellt das nicht auf — curl wertet CORP nicht aus.
    #
    # CORP schuetzt vor dem Auslesen VERTRAULICHER Antworten durch fremde
    # Seiten (Spectre-Klasse). Ein oeffentliches Logo ist nicht vertraulich,
    # und eingebettet werden soll es ausdruecklich. Deshalb hier "cross-origin".
    #
    # BEWUSST nur Bilder: CSS und JavaScript bleiben im Block darunter auf
    # "same-origin" — die will niemand fremd einbetten. Dieser Block steht
    # VOR dem allgemeinen, weil nginx den ersten passenden Ausdruck nimmt.
    # ───────────────────────────────────────────────────────────────────────
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.partsunion.de https://webexapis.com https://*.webexapis.com https://*.webex.com https://*.wbx2.com https://*.ciscospark.com https://*.webexcontent.com wss://*.webex.com wss://*.wbx2.com wss://*.ciscospark.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; manifest-src 'self'; media-src 'self' blob: https://*.webex.com https://*.webexcontent.com https://*.wbx2.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }

    # Gehashte Bausteine muessen bei fehlender Datei 404 ergeben und duerfen
    # NIE auf index.html ausweichen. Sonst bekommt der Browser HTML mit Status
    # 200 dort, wo er JavaScript erwartet, und bricht ab:
    #     TypeError: 'text/html' is not a valid JavaScript MIME type.
    # Das passiert bei jedem Deployment — Vite vergibt neue Dateinamen, und wer
    # die Seite offen hatte, fordert ein Buendel an, das es nicht mehr gibt.
    # Genau so entstand am 2026-07-29 der Fehlerbildschirm nach jedem Deploy.
    # Das `try_files $uri =404` unten ist deshalb kein Detail.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.partsunion.de https://webexapis.com https://*.webexapis.com https://*.webex.com https://*.wbx2.com https://*.ciscospark.com https://*.webexcontent.com wss://*.webex.com wss://*.wbx2.com wss://*.ciscospark.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; manifest-src 'self'; media-src 'self' blob: https://*.webex.com https://*.webexcontent.com https://*.wbx2.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
    }
}
